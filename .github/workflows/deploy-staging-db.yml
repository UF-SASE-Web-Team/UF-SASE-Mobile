name: Deploy Staging Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Push Migrations to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to staging
        run: |
          supabase db push --db-url "${{ secrets.SUPABASE_STAGING_DB_URL }}"
