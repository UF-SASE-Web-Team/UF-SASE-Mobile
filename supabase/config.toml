# Declarative Supabase CLI 3 Configuration

project_id = "uf-sase"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 200

[db.seed]
enabled = true
sql_paths = [
  "seeds/01_academic_terms.sql",
  "seeds/02_app_settings.sql",
  "seeds/03_programs.sql",
  "seeds/04_resources.sql",
  "seeds/05_reviewer_accounts.sql",
  "seeds/06_events.sql"
]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local email testing with Mailpit (web UI at http://127.0.0.1:54324)
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "env(SITE_URL)"
additional_redirect_urls = ["ufsasemobile://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.rate_limit]
email_sent = 1000
sms_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "[UF SASE] Email verification code"
content_path = "./supabase/templates/verification.html"

[auth.email.template.recovery]
subject = "[UF SASE] Password reset code"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "[UF SASE] Your login code"

# Default SMTP configuration:
# Kept disabled locally so [local_smtp] (Mailpit) catches all emails.
# Remotes enable Resend via [remotes.*] blocks below.
[auth.email.smtp]
enabled = false
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "alerts@email.ufsase.com"
sender_name = "UF SASE"

[auth.sms]
enabled = false
enable_confirmations = false

# External OAuth Providers (configured for future launch; disabled for initial release)
[auth.external.google]
enabled = false
client_id = "284522033019-lnhe7vt7t5336lchntk75epb7l5om5ar.apps.googleusercontent.com,284522033019-plrq1c36k5fhndp58t4rc0erviqvq6qp.apps.googleusercontent.com,284522033019-4odltam1umlnv7bd4qss474jt4geqv40.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Functions used before the member is signed in, so there is no user JWT to verify.
[functions.login]
verify_jwt = false

[analytics]
enabled = true
port = 54327
backend = "postgres"

# CLI 3 Environment Remotes
[remotes.staging]
project_id = "yoazhfliefswktpszaob"
[remotes.staging.auth.email.smtp]
enabled = true

[remotes.prod]
project_id = "lbauzxflhubvbnrkbprp"
[remotes.prod.auth.email.smtp]
enabled = true

[experimental.pgdelta]
enabled = true
