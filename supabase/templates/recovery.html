<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your UF SASE password reset code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap');
      body,
      p,
      td,
      th,
      div,
      span {
        font-family:
          'Red Hat Text',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      h1,
      h2,
      h3,
      .heading-oswald {
        font-family:
          'Oswald',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family:
        'Red Hat Text',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    "
  >
    <table
      role="presentation"
      width="100%"
      border="0"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #ffffff"
    >
      <tr>
        <td align="center" style="padding: 40px 20px">
          <!-- Main Container -->
          <table
            role="presentation"
            width="100%"
            border="0"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 520px; width: 100%; text-align: left"
          >
            <!-- Top Logo -->
            <tr>
              <td style="padding-bottom: 36px">
                <a
                  href="https://ufsase.com"
                  target="_blank"
                  style="text-decoration: none; display: inline-block"
                >
                  <img
                    src="https://lbauzxflhubvbnrkbprp.supabase.co/storage/v1/object/public/public-assets/email-template-logo.png"
                    alt="UF SASE"
                    height="32"
                    style="
                      height: 32px;
                      width: auto;
                      max-width: 140px;
                      display: block;
                      border: 0;
                      outline: none;
                      font-size: 20px;
                      font-weight: 700;
                      color: #111827;
                      font-family: 'Oswald', sans-serif;
                    "
                  />
                </a>
              </td>
            </tr>

            <!-- Heading -->
            <tr>
              <td style="padding-bottom: 16px">
                <h1
                  class="heading-oswald"
                  style="
                    margin: 0;
                    font-family:
                      'Oswald',
                      -apple-system,
                      BlinkMacSystemFont,
                      'Segoe UI',
                      Roboto,
                      sans-serif;
                    font-size: 28px;
                    font-weight: 700;
                    color: #111827;
                    letter-spacing: 0.2px;
                    line-height: 1.25;
                  "
                >
                  🔐 Your UF SASE password reset code
                </h1>
              </td>
            </tr>

            <!-- Intro Message -->
            <tr>
              <td style="padding-bottom: 32px">
                <p
                  style="
                    margin: 0;
                    font-family:
                      'Red Hat Text',
                      -apple-system,
                      BlinkMacSystemFont,
                      'Segoe UI',
                      Roboto,
                      sans-serif;
                    font-size: 15px;
                    line-height: 24px;
                    color: #374151;
                  "
                >
                  Enter this code to reset your password:
                </p>
              </td>
            </tr>

            <!-- OTP Code Box -->
            <tr>
              <td align="center" style="padding-bottom: 36px">
                <div
                  style="
                    font-family:
                      'Red Hat Text',
                      -apple-system,
                      BlinkMacSystemFont,
                      'Segoe UI',
                      Roboto,
                      sans-serif;
                    font-size: 44px;
                    font-weight: 700;
                    letter-spacing: 6px;
                    color: #111827;
                    text-align: center;
                    line-height: 1.2;
                  "
                >
                  {{ .Token }}
                </div>
              </td>
            </tr>

            <!-- Security Note & Sign-off -->
            <tr>
              <td style="padding-bottom: 16px">
                <p
                  style="
                    margin: 0;
                    font-family:
                      'Red Hat Text',
                      -apple-system,
                      BlinkMacSystemFont,
                      'Segoe UI',
                      Roboto,
                      sans-serif;
                    font-size: 15px;
                    line-height: 24px;
                    color: #374151;
                  "
                >
                  If you didn't request it, you can ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 36px">
                <p
                  style="
                    margin: 0;
                    font-family:
                      'Red Hat Text',
                      -apple-system,
                      BlinkMacSystemFont,
                      'Segoe UI',
                      Roboto,
                      sans-serif;
                    font-size: 15px;
                    line-height: 24px;
                    color: #374151;
                    font-weight: 600;
                  "
                >
                  The UF SASE Web Team
                </p>
              </td>
            </tr>

            <!-- Divider (darker) -->
            <tr>
              <td style="padding-bottom: 24px">
                <hr style="margin: 0; border: none; border-top: 1px solid #d1d5db" />
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td>
                <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="left" valign="middle">
                      <a
                        href="https://ufsase.com"
                        target="_blank"
                        style="text-decoration: none; display: inline-block"
                      >
                        <img
                          src="https://lbauzxflhubvbnrkbprp.supabase.co/storage/v1/object/public/public-assets/email-template-logo.png"
                          alt="UF SASE"
                          height="20"
                          style="
                            height: 20px;
                            width: auto;
                            max-width: 90px;
                            display: block;
                            border: 0;
                            opacity: 0.85;
                          "
                        />
                      </a>
                    </td>
                    <td align="right" valign="middle">
                      <table
                        role="presentation"
                        border="0"
                        cellpadding="0"
                        cellspacing="0"
                        style="display: inline-table"
                      >
                        <tr>
                          <td style="padding-left: 18px">
                            <a
                              href="https://instagram.com/ufsase"
                              target="_blank"
                              title="Instagram"
                              style="
                                text-decoration: none;
                                display: inline-block;
                                vertical-align: middle;
                              "
                            >
                              <img
                                src="https://cdn.simpleicons.org/instagram/6b7280"
                                alt="Instagram"
                                width="18"
                                height="18"
                                style="width: 18px; height: 18px; display: block; border: 0"
                              />
                            </a>
                          </td>
                          <td style="padding-left: 18px">
                            <a
                              href="https://discord.gg/ufsase"
                              target="_blank"
                              title="Discord"
                              style="
                                text-decoration: none;
                                display: inline-block;
                                vertical-align: middle;
                              "
                            >
                              <img
                                src="https://cdn.simpleicons.org/discord/6b7280"
                                alt="Discord"
                                width="18"
                                height="18"
                                style="width: 18px; height: 18px; display: block; border: 0"
                              />
                            </a>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
